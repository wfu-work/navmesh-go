name: Build NavMesh binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: ""
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: ""
          - goos: darwin
            goarch: amd64
            runner: macos-13
            ext: ""
          - goos: darwin
            goarch: arm64
            runner: macos-14
            ext: ""
          - goos: windows
            goarch: amd64
            runner: windows-2022
            ext: ".exe"
          - goos: windows
            goarch: arm64
            runner: ubuntu-24.04
            cc: "zig cc -target aarch64-windows-gnu"
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux musl toolchain
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Zig for Windows ARM64 cgo
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        uses: mlugg/setup-zig@v2

      - name: Build navmesh-server and navmesh-client
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        shell: bash
        run: |
          mkdir -p dist

          ldflags="-s -w"
          tags=()
          if [ "${GOOS}" = "linux" ]; then
            export CC=musl-gcc
            ldflags='-s -w -linkmode external -extldflags "-static"'
            tags=(-tags "netgo osusergo")
          fi
          if [ "${GOOS}-${GOARCH}" = "windows-arm64" ]; then
            export CC="${CC}"
            export CXX="${CC}"
          fi

          go build \
            -trimpath \
            "${tags[@]}" \
            -ldflags="${ldflags}" \
            -o "dist/navmesh-server-${GOOS}-${GOARCH}${{ matrix.ext }}" \
            ./
          go build \
            -trimpath \
            "${tags[@]}" \
            -ldflags="${ldflags}" \
            -o "dist/navmesh-client-${GOOS}-${GOARCH}${{ matrix.ext }}" \
            ./cmd/navmesh-client

      - name: Upload navmesh-server artifact
        uses: actions/upload-artifact@v7
        with:
          name: navmesh-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/navmesh-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error
          archive: false

      - name: Upload navmesh-client artifact
        uses: actions/upload-artifact@v7
        with:
          name: navmesh-client-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/navmesh-client-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error
          archive: false

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/navmesh-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            dist/navmesh-client-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          overwrite_files: true
