name: Build NavMesh binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build navmesh-server and navmesh-client
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/navmesh-server-${GOOS}-${GOARCH}${{ matrix.ext }}" \
            ./
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/navmesh-client-${GOOS}-${GOARCH}${{ matrix.ext }}" \
            ./cmd/navmesh-client

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: navmesh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/navmesh-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            dist/navmesh-client-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error
