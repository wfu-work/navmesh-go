system:
  app-name: "navmesh"
  addr: 3007
  db-type: sqlite
  router-prefix: /api
jwt:
  issuer: navmesh
  signing-key: "navmesh"
  expires-time: 24h
  buffer-time: 1h
local:
  oss-path: ./data/oss
  proxy-oss-path: /oss
  cache-path: ./data/cache.json
sqlite:
  db-name: navmesh
  path: ./data/
zap:
  director: logback
  level: info
  prefix: '[navmesh-server]'
  retention-day: 3
navmesh:
  data-dir: ./data/navmesh
  heartbeat-timeout: 180s
  device-register-token: "navfirst@2020"
