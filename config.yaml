system:
  app-name: "navmesh"
  addr: 3007
  db-type: sqlite
  router-prefix: /api
jwt:
  issuer: navmesh
  signing-key: "navmesh"
  expires-time: 24h
  buffer-time: 1h
local:
  oss-path: ./data/oss
  proxy-oss-path: /oss
  cache-path: ./data/cache.json
sqlite:
  db-name: navmesh
  path: ./data/
  log-mode: warn
  max-idle-conns: 8
  max-open-conns: 8
zap:
  director: logback
  level: info
  prefix: '[navmesh-server]'
  retention-day: 3
navmesh:
  data-dir: ./data/navmesh
  heartbeat-timeout: 180s
  liveness-flush-interval: 30s
  telemetry-sample-interval: 5m
  access-log-queue-size: 8192
  access-log-batch-size: 200
  access-log-flush-interval: 100ms
  database-slow-threshold: 200ms
  notification-workers: 4
  notification-queue-size: 1024
  device-register-token: "navfirst@2020"
